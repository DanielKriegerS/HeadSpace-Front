<app-authentication-layout
  title="Bem-vindo ao HeadSpace"
  description="Entre para acessar sua experiência pessoal na plataforma.">

  <section class="login">
    <button
      class="login__google-button"
      type="button"
      (click)="loginWithGoogle()">

      <span
        class="login__google-symbol"
        aria-hidden="true">
        G
      </span>

      <span>
        Entrar com Google
      </span>
    </button>

    <p class="login__security-note">
      A autenticação é processada de forma segura pelo Google.
      O HeadSpace não recebe nem armazena sua senha.
    </p>
  </section>
</app-authentication-layout>
